[project]
name = "frontend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AHAD3107", email = "abdul31abd@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "nicegui>=3.18.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
frontend = "frontend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
