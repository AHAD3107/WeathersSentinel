[project]
name = "backend"
version = "0.1.0"
description = "WeatherSentinel backend API"
readme = "README.md"
authors = [
    { name = "AHAD3107", email = "abdul31abd@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "confluent-kafka>=2.15.1",
    "fastapi>=0.142.2",
    "geoalchemy2>=0.20.0",
    "joblib>=1.6.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyspark>=4.2.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
